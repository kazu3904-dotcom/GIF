<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MP4 → GIF かんたん変換</title>
  <style>
    :root{font-family:"Segoe UI","Yu Gothic UI",sans-serif;color:#18202a;background:#eef2f6}*{box-sizing:border-box}
    body{margin:0;padding:28px}.app{max-width:960px;margin:auto;background:#fff;border-radius:20px;box-shadow:0 14px 45px #18324c20;overflow:hidden}
    header{padding:26px 30px;background:linear-gradient(135deg,#1e6ee8,#6547dc);color:#fff}h1{margin:0 0 6px;font-size:26px}header p{margin:0;opacity:.9}
    main{padding:26px 30px}.drop{border:2px dashed #9ab1ce;border-radius:16px;padding:28px;text-align:center;background:#f8fbff;cursor:pointer;transition:.2s}.drop.over{background:#eaf3ff;border-color:#2775df}.drop strong{display:block;font-size:18px;margin-bottom:7px}.drop small{color:#627287}
    input[type=file]{display:none}.workspace{display:none;margin-top:22px}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:22px}video,.result img{width:100%;max-height:360px;background:#111;border-radius:12px;object-fit:contain}
    .panel{background:#f6f8fb;border:1px solid #e0e6ee;border-radius:14px;padding:18px}.row{margin-bottom:15px}.row label{display:flex;justify-content:space-between;font-weight:650;margin-bottom:7px}.row input[type=range]{width:100%}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.num{width:100%;padding:9px;border:1px solid #bdc9d7;border-radius:8px;font-size:15px}
    button,.download{border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;text-align:center}.primary{width:100%;color:#fff;background:#226ee1}.primary:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#e9eef5;color:#26384d}
    .status{margin-top:14px;color:#536477;font-size:14px}.bar{height:9px;border-radius:9px;background:#dce4ee;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;width:0;background:#2876e8;transition:.12s}.result{display:none;margin-top:24px;padding-top:22px;border-top:1px solid #e2e7ed}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.download{display:block;background:#13834e;color:#fff;text-decoration:none;margin-top:12px}.note{font-size:13px;color:#637185;line-height:1.6;margin-top:16px}.meta{font-size:14px;color:#526274;margin:8px 0}.warn{color:#a54b00;font-weight:650}@media(max-width:720px){body{padding:0}.app{border-radius:0}.grid,.result-grid{grid-template-columns:1fr}main{padding:20px}header{padding:22px}}
  </style>
</head>
<body><div class="app"><header><h1>MP4 → GIF かんたん変換</h1><p>動画はアップロードされません。変換はこの端末の中だけで行います。</p></header><main>
  <div class="drop" id="drop" role="button" tabindex="0"><strong>MP4をここへドロップ</strong><span>またはクリックして動画を選択</span><br><small>短い場面（目安15秒以内）のGIF化に適しています</small><input id="file" type="file" accept="video/mp4,video/*"></div>
  <section class="workspace" id="workspace"><div class="grid"><div><video id="video" controls muted playsinline></video><div class="meta" id="fileMeta"></div></div>
  <div class="panel"><div class="twocol"><div class="row"><label for="start">開始（秒）</label><input class="num" id="start" type="number" min="0" step="0.1" value="0"></div><div class="row"><label for="end">終了（秒）</label><input class="num" id="end" type="number" min="0.1" step="0.1" value="5"></div></div>
  <div class="row"><label for="width">横幅 <span id="widthVal">600 px</span></label><input id="width" type="range" min="240" max="960" step="40" value="600"></div>
  <div class="row"><label for="fps">なめらかさ <span id="fpsVal">10 fps</span></label><input id="fps" type="range" min="5" max="15" step="1" value="10"></div>
  <div class="row"><label for="quality">画質 <span id="qualityVal">標準</span></label><input id="quality" type="range" min="0" max="2" step="1" value="1"></div>
  <button class="primary" id="convert">GIFに変換</button><div class="status" id="status">動画を選択してください</div><div class="bar"><i id="progress"></i></div>
  <p class="note">GIFには音声が入りません。容量が大きいときは、時間・横幅・FPSを下げてください。</p></div></div></section>
  <section class="result" id="result"><h2>変換できました</h2><div class="result-grid"><div><img id="gif" alt="変換したGIFのプレビュー"></div><div><div class="meta" id="gifMeta"></div><a class="download" id="download" download="animation.gif">GIFを保存</a><button class="secondary" id="again" style="width:100%;margin-top:10px">設定を変えて再変換</button></div></div></section>
</main></div>
<script>
'use strict';
const $=id=>document.getElementById(id), file=$('file'), drop=$('drop'), video=$('video'); let sourceName='animation', gifUrl='';
drop.onclick=e=>{if(e.target!==file)file.click()};drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}}; ['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('over')})); ['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('over')})); drop.addEventListener('drop',e=>load(e.dataTransfer.files[0])); file.onchange=()=>load(file.files[0]);
function load(f){if(!f)return;if(!f.type.startsWith('video/'))return alert('動画ファイルを選択してください。'); sourceName=f.name.replace(/\.[^.]+$/,''); video.src=URL.createObjectURL(f); video.onloadedmetadata=()=>{let d=video.duration;$('end').value=Math.min(5,d).toFixed(1);$('start').max=d.toFixed(1);$('end').max=d.toFixed(1);$('fileMeta').textContent=`${f.name} ・ ${fmt(d)} ・ ${video.videoWidth}×${video.videoHeight}`;$('workspace').style.display='block';$('status').textContent='設定して「GIFに変換」を押してください';};}
$('width').oninput=()=>$('widthVal').textContent=$('width').value+' px';$('fps').oninput=()=>$('fpsVal').textContent=$('fps').value+' fps';$('quality').oninput=()=>$('qualityVal').textContent=['軽量','標準','高画質'][$('quality').value];$('again').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});};
const delay=ms=>new Promise(r=>setTimeout(r,ms)); function fmt(s){return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`}
function seek(t){return new Promise((res,rej)=>{let done=()=>{video.removeEventListener('seeked',done);res()};video.addEventListener('seeked',done);video.currentTime=Math.min(t,Math.max(0,video.duration-.001));setTimeout(()=>rej(new Error('動画の読み取りがタイムアウトしました')),10000)})}
class Bytes{constructor(){this.a=[]}b(...v){this.a.push(...v.map(x=>x&255))}s(x){for(const c of x)this.b(c.charCodeAt(0))}w(x){this.b(x,x>>8)}blob(){return new Blob([new Uint8Array(this.a)],{type:'image/gif'})}}
function palette(level){let p=[];for(let i=0;i<256;i++){let r=(i>>5)&7,g=(i>>2)&7,b=i&3;p.push(Math.round(r*255/7),Math.round(g*255/7),Math.round(b*255/3))}return p}
function indices(data,w,h,q){let out=new Uint8Array(w*h),dither=q>0,errR=new Float32Array(w+2),errG=new Float32Array(w+2),errB=new Float32Array(w+2),nextR=new Float32Array(w+2),nextG=new Float32Array(w+2),nextB=new Float32Array(w+2);for(let y=0;y<h;y++){for(let x=0;x<w;x++){let k=(y*w+x)*4,r=Math.max(0,Math.min(255,data[k]+errR[x+1])),g=Math.max(0,Math.min(255,data[k+1]+errG[x+1])),b=Math.max(0,Math.min(255,data[k+2]+errB[x+1])),ri=Math.round(r*7/255),gi=Math.round(g*7/255),bi=Math.round(b*3/255);out[y*w+x]=(ri<<5)|(gi<<2)|bi;if(dither){let f=q===2?1:.65,er=(r-ri*255/7)*f,eg=(g-gi*255/7)*f,eb=(b-bi*255/3)*f;errR[x+2]+=er*7/16;errG[x+2]+=eg*7/16;errB[x+2]+=eb*7/16;nextR[x]+=er*3/16;nextG[x]+=eg*3/16;nextB[x]+=eb*3/16;nextR[x+1]+=er*5/16;nextG[x+1]+=eg*5/16;nextB[x+1]+=eb*5/16;nextR[x+2]+=er/16;nextG[x+2]+=eg/16;nextB[x+2]+=eb/16;}}[errR,nextR]=[nextR,errR];[errG,nextG]=[nextG,errG];[errB,nextB]=[nextB,errB];nextR.fill(0);nextG.fill(0);nextB.fill(0)}return out}
// Compatibility-first GIF-LZW stream. Clearing the dictionary before its
// code width changes avoids decoder-specific boundary differences.
function lzw(pix){const clear=256,eoi=257,buf=[];let cur=0,bits=0,sinceClear=0;const put=c=>{cur|=c<<bits;bits+=9;while(bits>=8){buf.push(cur&255);cur>>=8;bits-=8}};put(clear);for(let i=0;i<pix.length;i++){put(pix[i]);sinceClear++;if(sinceClear===250&&i+1<pix.length){put(clear);sinceClear=0}}put(eoi);if(bits)buf.push(cur&255);return buf}
function block(out,data){out.b(8);for(let i=0;i<data.length;i+=255){let n=Math.min(255,data.length-i);out.b(n,...data.slice(i,i+n))}out.b(0)}
function header(out,w,h){out.s('GIF89a');out.w(w);out.w(h);out.b(0xF7,0,0,...palette());out.b(0x21,0xFF,11);out.s('NETSCAPE2.0');out.b(3,1,0,0,0)}
function frame(out,pix,w,h,cs){out.b(0x21,0xF9,4,0x04);out.w(cs);out.b(0,0);out.b(0x2C);out.w(0);out.w(0);out.w(w);out.w(h);out.b(0);block(out,lzw(pix))}
$('convert').onclick=async()=>{let start=+$('start').value,end=+$('end').value,fps=+$('fps').value,w=+$('width').value,q=+$('quality').value;if(!video.src)return;if(!(end>start)||start<0||end>video.duration+.01)return alert('開始・終了時間を確認してください。');if(end-start>20)return alert('ブラウザ版では一度に20秒までです。終了時間を短くしてください。');let h=Math.round(w*video.videoHeight/video.videoWidth);if(h%2)h++;let count=Math.max(1,Math.floor((end-start)*fps)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d',{willReadFrequently:true}),out=new Bytes();header(out,w,h);$('convert').disabled=true;$('result').style.display='none';try{for(let i=0;i<count;i++){await seek(start+i/fps);ctx.drawImage(video,0,0,w,h);let px=indices(ctx.getImageData(0,0,w,h).data,w,h,q);frame(out,px,w,h,Math.round(100/fps));let pct=Math.round((i+1)/count*100);$('progress').style.width=pct+'%';$('status').textContent=`変換中… ${i+1} / ${count} フレーム`;await delay(0)}out.b(0x3B);let blob=out.blob();if(gifUrl)URL.revokeObjectURL(gifUrl);gifUrl=URL.createObjectURL(blob);$('gif').src=gifUrl;$('download').href=gifUrl;$('download').download=sourceName+'.gif';$('gifMeta').innerHTML=`${w}×${h}px ・ ${fps}fps ・ ${(blob.size/1024/1024).toFixed(1)}MB${blob.size>20*1024*1024?'<br><span class="warn">容量が大きめです。横幅・FPS・時間を下げると軽くなります。</span>':''}`;$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth'});$('status').textContent='変換完了';}catch(e){console.error(e);alert('変換できませんでした。別のMP4、または短い範囲でお試しください。\n'+e.message);$('status').textContent='エラーが発生しました';}finally{$('convert').disabled=false;}}
</script></body></html>
